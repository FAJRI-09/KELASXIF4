<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Foto Cewek - XI F4</title>
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0c2340, #1a4a7a, #2e6db4);
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* ===== EFK BINTANG ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(2px 2px at 20px 30px, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 50px 160px, rgba(255,255,255,0.4), transparent),
                radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.3), transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.2), transparent),
                radial-gradient(2px 2px at 160px 30px, rgba(255,255,255,0.4), transparent);
            background-size: 200px 200px;
            animation: bintang 20s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes bintang {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }

        /* ===== KONTENER ===== */
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 40px;
            padding: 40px 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header h1 {
            color: white;
            font-size: clamp(24px, 4vw, 36px);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header h1 span {
            color: #e74c94;
            text-shadow: 0 0 30px rgba(231, 76, 148, 0.3);
        }

        .btn-kembali {
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }

        .btn-kembali:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            border-color: #e74c94;
            box-shadow: 0 8px 25px rgba(231, 76, 148, 0.2);
        }

        /* ===== GALERI ===== */
        .galeri {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .foto-item {
            position: relative;
            border-radius: 18px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            aspect-ratio: 4/3;
            border: 2px solid rgba(255, 255, 255, 0.06);
            transition: 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
        }

        .foto-item:hover {
            transform: scale(1.04) translateY(-6px);
            border-color: #e74c94;
            box-shadow: 0 15px 45px rgba(231, 76, 148, 0.3);
            z-index: 2;
        }

        .foto-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: 0.5s ease;
        }

        .foto-item:hover img {
            filter: brightness(1.08) saturate(1.05);
            transform: scale(1.02);
        }

        /* ===== OVERLAY GLOW ===== */
        .foto-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, transparent 50%, rgba(231, 76, 148, 0.1) 100%);
            opacity: 0;
            transition: 0.4s ease;
            pointer-events: none;
            border-radius: 18px;
        }

        .foto-item:hover::after {
            opacity: 1;
        }

        /* ===== COUNTER BADGE ===== */
        .badge-counter {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(-10px);
            transition: 0.4s ease;
            letter-spacing: 0.5px;
        }

        .foto-item:hover .badge-counter {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== PLACEHOLDER ===== */
        .foto-item .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            background: linear-gradient(135deg, rgba(231, 76, 148, 0.15), rgba(231, 76, 148, 0.04));
            color: rgba(255, 255, 255, 0.2);
            border-radius: 18px;
        }

        /* ===== MODAL FULLSCREEN ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: fadeIn 0.35s ease;
        }

        .modal.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.05);
        }

        .modal-close {
            position: absolute;
            top: 25px;
            right: 35px;
            font-size: 40px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: 0.3s;
            background: none;
            border: none;
            font-weight: 300;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-close:hover {
            color: white;
            transform: rotate(90deg);
            background: rgba(231, 76, 148, 0.2);
            border-color: #e74c94;
        }

        /* ===== INFO ===== */
        .info {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            margin-top: 25px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .info span {
            color: #e74c94;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container { padding: 25px 18px; border-radius: 28px; }
            .header { flex-direction: column; text-align: center; }
            .galeri { grid-template-columns: 1fr; gap: 15px; }
            .foto-item .placeholder { font-size: 40px; }
            .modal-close { top: 15px; right: 15px; font-size: 30px; width: 40px; height: 40px; }
        }

        @media (max-width: 400px) {
            .container { padding: 18px 12px; border-radius: 20px; }
            .galeri { gap: 12px; }
        }

        @media (max-height: 500px) and (orientation: landscape) {
            .container { padding: 18px 25px; border-radius: 24px; }
            .header { margin-bottom: 15px; }
            .header h1 { font-size: 20px; }
            .galeri { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .foto-item { aspect-ratio: 4/3; }
            .foto-item .placeholder { font-size: 30px; }
            .info { margin-top: 12px; font-size: 11px; }
            .modal-close { top: 10px; right: 10px; font-size: 24px; width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ===== HEADER ===== -->
        <div class="header">
            <h1>📸 <span>Foto</span> Cewek</h1>
            <a href="cewek.html" class="btn-kembali">⬅ Kembali</a>
        </div>

        <!-- ===== GALERI FOTO ===== -->
        <div class="galeri" id="galeriFoto">
            <!-- Data akan diisi oleh JavaScript -->
        </div>

        <p class="info">✨ Koleksi foto <span>cewek</span> XI F4 ✨</p>
    </div>

    <!-- ===== MODAL FULLSCREEN ===== -->
    <div class="modal" id="modalFoto" onclick="tutupModal()">
        <button class="modal-close" onclick="tutupModal()">✕</button>
        <img id="modalImg" src="" alt="Foto Fullscreen" />
    </div>

    <script>
        // ===== DATA FOTO CEWEK (5 FOTO) =====
        const fotoCewek = [
            { src: 'cewek1.jpg', alt: 'Foto cewek 1' },
            { src: 'cewek2.jpg', alt: 'Foto cewek 2' },
            { src: 'cewek3.jpg', alt: 'Foto cewek 3' },
            { src: 'cewek4.jpg', alt: 'Foto cewek 4' },
            { src: 'cewek5.jpg', alt: 'Foto cewek 5' }
        ];

        // ===== TAMPILKAN FOTO =====
        function tampilkanFoto() {
            const container = document.getElementById('galeriFoto');
            let html = '';

            fotoCewek.forEach((foto, index) => {
                html += `
                    <div class="foto-item" onclick="bukaModal('${foto.src}')">
                        <img src="${foto.src}" alt="${foto.alt}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'" />
                        <div class="placeholder" style="display:none;">👧</div>
                        <span class="badge-counter">#${index + 1}</span>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ===== MODAL FULLSCREEN =====
        function bukaModal(src) {
            const modal = document.getElementById('modalFoto');
            const img = document.getElementById('modalImg');
            img.src = src;
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function tutupModal() {
            const modal = document.getElementById('modalFoto');
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // ===== TUTUP DENGAN ESC =====
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                tutupModal();
            }
        });

        // ===== EKSEKUSI =====
        tampilkanFoto();
    </script>

</body>
</html>
