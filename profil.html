<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>Profil Siswa • F4 SMAN 2 Enok</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#030914;
    --bg2:#071a2d;
    --line:rgba(150,210,255,.14);
    --white:#f7fbff;
    --muted:#91a9bd;
    --blue:#62b9ff;
    --blue-dark:#248fe9;
    --cyan:#5ce3d0;
    --gold:#fdcb6e;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    padding:22px;
    color:var(--white);
    font-family:Inter,Segoe UI,Arial,sans-serif;
    background:
        radial-gradient(circle at 5% 0%,rgba(41,137,255,.20),transparent 30%),
        radial-gradient(circle at 95% 80%,rgba(54,220,200,.11),transparent 28%),
        linear-gradient(145deg,var(--bg),var(--bg2) 55%,#0a3150);
    overflow-x:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.20;
    background-image:
        radial-gradient(rgba(255,255,255,.7) .7px,transparent .7px);
    background-size:32px 32px;
    z-index:0;
}

.orb{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    pointer-events:none;
    z-index:0;
}

.orb.one{
    width:300px;
    height:300px;
    left:-150px;
    top:-100px;
    background:rgba(41,137,255,.18);
}

.orb.two{
    width:250px;
    height:250px;
    right:-100px;
    bottom:-80px;
    background:rgba(92,227,208,.12);
}

.container{
    width:min(540px,100%);
    margin:auto;
    position:relative;
    z-index:1;
}

/* =========================
   CARD PROFIL
========================= */
.card{
    padding:38px 32px;
    border-radius:36px;
    border:1px solid var(--line);
    background:linear-gradient(145deg,rgba(255,255,255,.085),rgba(255,255,255,.025));
    box-shadow:
        0 35px 90px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.1);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
    text-align:center;
    position:relative;
    overflow:hidden;
    animation:enter .7s cubic-bezier(.2,.8,.2,1);
}

@keyframes enter{
    from{opacity:0;transform:translateY(25px) scale(.97);}
    to{opacity:1;transform:translateY(0) scale(1);}
}

.card::before{
    content:"";
    position:absolute;
    width:400px;
    height:400px;
    top:-200px;
    right:-200px;
    background:radial-gradient(circle,rgba(41,137,255,.18),transparent 70%);
    pointer-events:none;
}

.card::after{
    content:"";
    position:absolute;
    width:300px;
    height:300px;
    bottom:-150px;
    left:-100px;
    background:radial-gradient(circle,rgba(92,227,208,.12),transparent 70%);
    pointer-events:none;
}

/* =========================
   TOMBOL KEMBALI
========================= */
.btn-kembali{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:10px 20px;
    background:rgba(255,255,255,.06);
    color:#eaf6ff;
    border:1px solid var(--line);
    border-radius:30px;
    text-decoration:none;
    font-weight:600;
    font-size:13px;
    transition:.3s;
    margin-bottom:28px;
    position:relative;
    z-index:1;
    backdrop-filter:blur(10px);
}

.btn-kembali:hover{
    background:rgba(41,137,255,.18);
    border-color:var(--blue);
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(41,137,255,.25);
}

/* =========================
   FOTO PROFIL
========================= */
.foto-wrapper{
    position:relative;
    width:155px;
    height:155px;
    margin:0 auto 22px;
    z-index:1;
}

.foto-wrapper::before{
    content:"";
    position:absolute;
    inset:-8px;
    border-radius:50%;
    border:1px solid rgba(98,185,255,.4);
    border-top-color:transparent;
    border-bottom-color:transparent;
    animation:spin 8s linear infinite;
    pointer-events:none;
}

.foto-wrapper::after{
    content:"";
    position:absolute;
    inset:-15px;
    border-radius:50%;
    border:1px dashed rgba(92,227,208,.2);
    animation:spin 12s linear infinite reverse;
    pointer-events:none;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.foto-profil{
    width:155px;
    height:155px;
    border-radius:50%;
    background:linear-gradient(145deg,rgba(41,137,255,.15),rgba(92,227,208,.05));
    border:4px solid rgba(255,255,255,.25);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:72px;
    box-shadow:
        0 15px 50px rgba(0,0,0,.45),
        0 0 30px rgba(41,137,255,.25);
    overflow:hidden;
    position:relative;
    z-index:1;
    transition:.4s;
    cursor:pointer;
}

.foto-profil img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.foto-wrapper:hover .foto-profil{
    border-color:var(--blue);
    box-shadow:
        0 15px 55px rgba(0,0,0,.5),
        0 0 45px rgba(41,137,255,.5);
    transform:scale(1.03);
}

/* =========================
   NAMA
========================= */
.nama-lengkap{
    color:white;
    font-size:26px;
    font-weight:850;
    margin-bottom:6px;
    letter-spacing:-.5px;
    position:relative;
    z-index:1;
    line-height:1.2;
}

.nama-panggilan{
    color:rgba(255,255,255,.6);
    font-size:14px;
    margin-bottom:22px;
    position:relative;
    z-index:1;
}

.nama-panggilan strong{
    color:var(--blue);
    font-weight:700;
}

/* =========================
   GARIS
========================= */
.garis{
    width:60px;
    height:3px;
    background:linear-gradient(90deg,transparent,var(--blue),transparent);
    margin:0 auto 22px;
    border-radius:10px;
    position:relative;
    z-index:1;
    box-shadow:0 0 15px rgba(98,185,255,.5);
}

/* =========================
   INFO GRID
========================= */
.info-grid{
    display:flex;
    flex-direction:column;
    gap:10px;
    text-align:left;
    position:relative;
    z-index:1;
}

.info-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 16px;
    background:rgba(255,255,255,.05);
    border-radius:13px;
    border:1px solid rgba(255,255,255,.07);
    transition:.3s;
    gap:10px;
}

.info-item:hover{
    background:rgba(41,137,255,.1);
    border-color:rgba(41,137,255,.25);
    transform:translateX(4px);
}

.info-item .label{
    color:rgba(255,255,255,.55);
    font-weight:600;
    font-size:12.5px;
    flex-shrink:0;
    letter-spacing:.2px;
}

.info-item .value{
    color:white;
    font-weight:700;
    font-size:13px;
    text-align:right;
    word-break:break-word;
}

.info-item .value.jk-putra{
    color:#4a90d9;
    text-shadow:0 0 12px rgba(74,144,217,.4);
}

.info-item .value.jk-putri{
    color:#e74c94;
    text-shadow:0 0 12px rgba(231,76,148,.4);
}

.info-item .value.cita{
    background:linear-gradient(95deg,#ffdf9e,#fdcb6e);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    font-weight:850;
}

/* =========================
   MOTTO BOX
========================= */
.motto-box{
    margin-top:20px;
    padding:18px 22px;
    background:linear-gradient(145deg,rgba(253,203,110,.1),rgba(253,203,110,.03));
    border-radius:16px;
    border:1px solid rgba(253,203,110,.2);
    text-align:center;
    position:relative;
    z-index:1;
    transition:.3s;
}

.motto-box:hover{
    border-color:rgba(253,203,110,.4);
    box-shadow:0 10px 30px rgba(253,203,110,.15);
}

.motto-box .label{
    color:rgba(255,255,255,.45);
    font-size:11px;
    font-weight:700;
    letter-spacing:2.5px;
    text-transform:uppercase;
}

.motto-box .motto{
    color:var(--gold);
    font-size:15px;
    font-weight:600;
    margin-top:8px;
    font-style:italic;
    line-height:1.7;
    text-shadow:0 0 20px rgba(253,203,110,.3);
}

/* =========================
   NOT FOUND
========================= */
.not-found{
    color:white;
    text-align:center;
    padding:30px 0;
    position:relative;
    z-index:1;
}

.not-found h2{
    font-size:26px;
    margin-bottom:10px;
    font-weight:800;
}

.not-found p{
    opacity:.6;
    font-size:14px;
}

/* =========================
   MODAL FOTO FULLSCREEN
========================= */
.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:9999;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(1,5,10,.95);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    animation:fadeIn .3s ease;
}

.modal.active{
    display:flex;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

.modal-close{
    position:absolute;
    top:18px;
    right:18px;
    z-index:10001;
    width:45px;
    height:45px;
    display:grid;
    place-items:center;
    border-radius:50%;
    color:white;
    font-size:20px;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.07);
    backdrop-filter:blur(10px);
    transition:.3s;
}

.modal-close:hover{
    transform:rotate(90deg);
    background:rgba(41,137,255,.3);
    border-color:var(--blue);
}

.modal-foto-wrapper{
    width:100%;
    height:90vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    touch-action:none;
}

.modal-foto-wrapper img{
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    border-radius:14px;
    user-select:none;
    -webkit-user-drag:none;
    cursor:grab;
    touch-action:none;
    transition:transform .12s ease-out;
    box-shadow:0 20px 60px rgba(0,0,0,.8);
}

.modal-foto-wrapper img:active{
    cursor:grabbing;
}

.zoom-hint{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    padding:8px 16px;
    border-radius:999px;
    color:#a8bac9;
    font-size:10px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(10px);
    white-space:nowrap;
    animation:fadeInOut 3s ease infinite;
}

@keyframes fadeInOut{
    0%,100%{opacity:.5;}
    50%{opacity:1;}
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:600px){
    body{
        padding:15px;
    }

    .card{
        padding:30px 22px;
        border-radius:28px;
    }

    .foto-wrapper,
    .foto-profil{
        width:130px;
        height:130px;
    }

    .foto-profil{
        font-size:58px;
    }

    .nama-lengkap{
        font-size:22px;
    }

    .info-item{
        padding:11px 14px;
        flex-direction:column;
        gap:5px;
        text-align:center;
    }

    .info-item .value{
        text-align:center;
    }

    .motto-box .motto{
        font-size:14px;
    }

    .modal-close{
        top:12px;
        right:12px;
        width:40px;
        height:40px;
        font-size:18px;
    }

    .zoom-hint{
        font-size:9px;
        bottom:15px;
    }
}

@media(max-width:390px){
    .card{
        padding:24px 16px;
        border-radius:22px;
    }

    .foto-wrapper,
    .foto-profil{
        width:110px;
        height:110px;
    }

    .foto-profil{
        font-size:48px;
    }

    .nama-lengkap{
        font-size:19px;
    }

    .btn-kembali{
        font-size:12px;
        padding:8px 16px;
    }
}

@media(max-height:550px) and (orientation:landscape){
    body{
        align-items:flex-start;
    }

    .card{
        padding:22px 28px;
        border-radius:24px;
        max-width:500px;
    }

    .foto-wrapper,
    .foto-profil{
        width:90px;
        height:90px;
    }

    .foto-profil{
        font-size:38px;
    }

    .foto-wrapper{
        margin-bottom:14px;
    }

    .nama-lengkap{
        font-size:20px;
    }

    .nama-panggilan{
        font-size:12px;
        margin-bottom:14px;
    }

    .garis{
        margin-bottom:14px;
    }

    .info-grid{
        gap:7px;
    }

    .info-item{
        padding:7px 12px;
        flex-direction:row;
        text-align:left;
    }

    .info-item .value{
        text-align:right;
    }

    .motto-box{
        margin-top:14px;
        padding:12px 16px;
    }

    .motto-box .motto{
        font-size:13px;
    }

    .btn-kembali{
        margin-bottom:14px;
        padding:6px 14px;
        font-size:12px;
    }
}
</style>

/* =============================================
   AMBIL ID DARI URL
============================================= */
function getParameter(nama){
    const url = new URL(window.location.href);
    return url.searchParams.get(nama);
}


/* =============================================
   TAMPILKAN PROFIL (TANPA NIK & NISN)
============================================= */
function tampilkanProfil(){

    const id = parseInt(getParameter("id"));
    const container = document.getElementById("profilContainer");
    const s = siswa.find(item => item.id === id);

    if(!s){
        container.innerHTML = `
            <div class="card">
                <a href="anggota.html" class="btn-kembali">← Kembali ke Anggota</a>
                <div class="not-found">
                    <h2>😕 Siswa Tidak Ditemukan</h2>
                    <p>ID: ${id} tidak ada dalam daftar</p>
                </div>
            </div>
        `;
        return;
    }

    const jkClass = s.jk === "Putra" ? "jk-putra" : "jk-putri";
    const fotoSrc = `absen${s.id}.jpg`;

    container.innerHTML = `
        <div class="card">

            <a href="anggota.html" class="btn-kembali">
                ← Kembali ke Anggota
            </a>

            <div class="foto-wrapper">
                <div class="foto-profil" onclick="bukaModalFoto('${fotoSrc}')">
                    <img
                        src="${fotoSrc}"
                        alt="${s.nama}"
                        onerror="this.parentElement.innerHTML='${s.emoji}'"
                    >
                </div>
            </div>

            <h1 class="nama-lengkap">${s.nama}</h1>
            <p class="nama-panggilan">👋 Dipanggil <strong>${s.panggilan}</strong></p>

            <div class="garis"></div>

            <div class="info-grid">

                <div class="info-item">
                    <span class="label">👤 Jenis Kelamin</span>
                    <span class="value ${jkClass}">${s.jk}</span>
                </div>

                <div class="info-item">
                    <span class="label">🎯 Hobi</span>
                    <span class="value">${s.hobi}</span>
                </div>

                <div class="info-item">
                    <span class="label">📅 TTL</span>
                    <span class="value">${s.ttl || '-'}</span>
                </div>

                <div class="info-item">
                    <span class="label">📍 Alamat</span>
                    <span class="value">${s.alamat || '-'}</span>
                </div>

                <div class="info-item">
                    <span class="label">🚀 Cita-Cita</span>

}

/* =============================================
   MODAL FOTO + ZOOM
============================================= */
let scale = 1;
let translateX = 0;
let translateY = 0;
let isDragging = false;
let startX = 0;
let startY = 0;
let startDistance = 0;
let lastTap = 0;

const modalFoto = document.getElementById("modalFoto");
const modalImg = document.getElementById("modalImg");
const fotoWrapper = document.getElementById("fotoWrapper");

function updateTransform(){
    modalImg.style.transform =
        `translate(${translateX}px,${translateY}px) scale(${scale})`;
}

function resetZoom(){
    scale = 1;
    translateX = 0;
    translateY = 0;
    updateTransform();
}

function bukaModalFoto(src){
    modalImg.src = src;
    resetZoom();
    modalFoto.classList.add("active");
    document.body.style.overflow = "hidden";
}

function tutupModalFoto(){
    modalFoto.classList.remove("active");
    document.body.style.overflow = "";
    resetZoom();
}

function getDistance(t1,t2){
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx*dx + dy*dy);
}

fotoWrapper.addEventListener("touchstart", e => {
    if(e.touches.length === 2){
        startDistance = getDistance(e.touches[0], e.touches[1]);
    } else if(e.touches.length === 1){
        startX = e.touches[0].clientX - translateX;
        startY = e.touches[0].clientY - translateY;

        const now = Date.now();
        if(now - lastTap < 300){
            if(scale > 1){ resetZoom(); }
                        else { scale = 2; updateTransform(); }
        }
        lastTap = now;
        isDragging = true;
    }
}, {passive:false});

fotoWrapper.addEventListener("touchmove", e => {
    e.preventDefault();
    if(e.touches.length === 2){
        const newDistance = getDistance(e.touches[0], e.touches[1]);
        if(startDistance > 0){
            const delta = newDistance / startDistance;
            scale = Math.min(Math.max(scale * delta, 1), 5);
        }
        startDistance = newDistance;
        updateTransform();
    } else if(e.touches.length === 1 && isDragging && scale > 1){
        translateX = e.touches[0].clientX - startX;
        translateY = e.touches[0].clientY - startY;
        updateTransform();
    }
}, {passive:false});

fotoWrapper.addEventListener("touchend", () => {
    isDragging = false;
    startDistance = 0;
});

fotoWrapper.addEventListener("wheel", e => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.15 : -0.15;
    scale = Math.min(Math.max(scale + delta, 1), 5);
    if(scale === 1){ translateX = 0; translateY = 0; }
    updateTransform();
}, {passive:false});

fotoWrapper.addEventListener("mousedown", e => {
    if(scale > 1){
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
    }
});

fotoWrapper.addEventListener("mousemove", e => {
    if(isDragging && scale > 1){
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
    }
});

fotoWrapper.addEventListener("mouseup", () => { isDragging = false; });
fotoWrapper.addEventListener("mouseleave", () => { isDragging = false; });

modalImg.addEventListener("dblclick", () => {
    if(scale > 1){ resetZoom(); }
    else { scale = 2; updateTransform(); }
});


/* =============================================
   KLIK BACKGROUND & ESCAPE
============================================= */
modalFoto.addEventListener("click", e => {
    if(e.target === modalFoto) tutupModalFoto();
});

document.addEventListener("keydown", e => {
    if(e.key === "Escape"){
        tutupModalFoto();
    }
});

</script>
