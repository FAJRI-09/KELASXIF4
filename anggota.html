<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anggota F4 • SMAN 2 Enok</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#06101f;--panel:rgba(12,30,52,.72);--line:rgba(142,217,255,.14);--blue:#71d0ff;--cyan:#55e4d0;--muted:#8fa7bc}
html{scroll-behavior:smooth}
body{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#fff;min-height:100vh;background:
radial-gradient(circle at 10% 0%,rgba(55,167,255,.20),transparent 30%),
radial-gradient(circle at 90% 20%,rgba(38,227,205,.11),transparent 28%),
linear-gradient(145deg,#020813,#071a31 55%,#020b16);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:38px 38px}
.glow{position:fixed;border-radius:50%;filter:blur(45px);pointer-events:none;z-index:0}.g1{width:260px;height:260px;left:-110px;bottom:-80px;background:rgba(0,145,255,.13)}.g2{width:220px;height:220px;right:-80px;top:12%;background:rgba(0,220,190,.08)}
.wrap{width:min(1120px,calc(100% - 30px));margin:auto;position:relative;z-index:1;padding:25px 0 35px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.back,.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:rgba(255,255,255,.055);color:#fff;text-decoration:none;border-radius:14px;padding:10px 15px;font-size:12px;backdrop-filter:blur(14px)}
.back:hover{border-color:rgba(113,208,255,.5);transform:translateX(-3px)}
.brand{font-size:10px;letter-spacing:3px;color:#6f879d}
.hero{text-align:center;padding:38px 10px 28px}
.kicker{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:#6e879d}
h1{font-size:clamp(38px,7vw,70px);letter-spacing:3px;margin:10px 0;background:linear-gradient(100deg,#fff,#8bdcff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
.hero p{color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 auto 22px;max-width:620px}
.stat{padding:17px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));backdrop-filter:blur(18px);text-align:center}
.stat b{font-size:26px;color:var(--blue);display:block}.stat span{font-size:9px;letter-spacing:2px;color:#70879b}
.controls{display:flex;gap:10px;margin-bottom:18px;position:sticky;top:10px;z-index:5}
.search{flex:1;position:relative}.search input{width:100%;height:50px;border:1px solid var(--line);border-radius:16px;background:rgba(4,15,29,.82);color:#fff;padding:0 18px 0 45px;outline:none;backdrop-filter:blur(18px)}.search input:focus{border-color:rgba(113,208,255,.55)}.search span{position:absolute;left:17px;top:14px;opacity:.55}
.filters{display:flex;gap:7px}.filter{border:1px solid var(--line);border-radius:14px;padding:0 17px;background:rgba(255,255,255,.055);color:#9bb0c2;cursor:pointer}.filter.active,.filter:hover{color:#fff;background:rgba(113,208,255,.12);border-color:rgba(113,208,255,.4)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.member{display:flex;align-items:center;gap:13px;min-height:102px;padding:15px;text-decoration:none;color:#fff;border:1px solid var(--line);border-radius:21px;background:linear-gradient(145deg,rgba(15,39,65,.75),rgba(8,23,40,.62));backdrop-filter:blur(18px);position:relative;overflow:hidden;transition:.28s}
.member:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(113,208,255,.10),transparent 48%);opacity:0;transition:.3s}.member:hover{transform:translateY(-4px);border-color:rgba(113,208,255,.42);box-shadow:0 18px 40px rgba(0,0,0,.28)}.member:hover:after{opacity:1}
.avatar{width:55px;height:55px;flex:0 0 55px;border-radius:17px;display:grid;place-items:center;font-size:25px;background:linear-gradient(145deg,rgba(113,208,255,.17),rgba(85,228,208,.07));border:1px solid rgba(113,208,255,.18);position:relative;z-index:1}
.info{min-width:0;position:relative;z-index:1}.info b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;margin-top:5px;color:#71889c;font-size:10px}.arrow{margin-left:auto;color:#557086;font-size:22px;position:relative;z-index:1}
.empty{text-align:center;padding:55px;color:#71889c;display:none}.footer{text-align:center;margin-top:30px;color:#4c6377;font-size:9px;letter-spacing:3px}.footer b{color:#67c9ff}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.wrap{width:min(100% - 20px,1120px);padding-top:15px}.brand{display:none}.hero{padding:30px 5px 23px}.controls{position:static;flex-direction:column}.filters{height:44px}.filter{flex:1}.grid{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:13px 8px}.stat b{font-size:22px}}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<main class="wrap">
<div class="top"><a class="back" href="index.html">← Kembali</a><div class="brand">F4 • SMAN 2 ENOK</div></div>
<section class="hero"><div class="kicker">Class Directory / 2026</div><h1>ANGGOTA F4</h1><p>35 cerita, satu kelas, satu kebersamaan.</p></section>
<section class="stats"><div class="stat"><b>35</b><span>TOTAL SISWA</span></div><div class="stat"><b>12</b><span>PUTRA</span></div><div class="stat"><b>23</b><span>PUTRI</span></div></section>
<div class="controls"><div class="search"><span>⌕</span><input id="search" placeholder="Cari nama atau panggilan..."></div><div class="filters"><button class="filter active" data-f="all">Semua</button><button class="filter" data-f="Putra">Putra</button><button class="filter" data-f="Putri">Putri</button></div></div>
<div class="grid" id="grid"></div><div class="empty" id="empty">Tidak ada anggota yang cocok dengan pencarian.</div>
<div class="footer">CLASS <b>F4</b> • SMAN 2 ENOK</div>
</main>
<script>
const siswa=[
["ADE SUBAGYO","Jio Tamfan","Putra"],["ADINDA RAMONA SARI","Dinda Kiyowo","Putri"],["ALFIN JUANDA SAPUTRA","Alpin","Putra"],["AULIA ZAHRA","Zahra","Putri"],["CINTA SYAFIKA PUTRI","Cinta","Putri"],["DAFFA HABIBIE ZIKRILLAH","Dapa/Dafa","Putra"],["DINDA NOVIRA","Dinda Gemes","Putri"],["FATHURRAHMAN","Patuy","Putra"],["HAIFA AMIRA","Mira","Putri"],["HERIAN SABINO","Iyan","Putra"],["INDRI NURMAYA SUCI","Indri","Putri"],["LILA PINTAN NUGRAHI","Lilac","Putri"],["M. MAULANA FAJRI","DG Mapatca'","Putra"],["M. RENDRA HIDAYATULLAH","Rendra/Enda","Putra"],["MAHDALENA","Lena","Putri"],["MELSA PUTRI LIEGA","Samel","Putri"],["MUHAMMAD ARDIANSYAH","Ardi","Putra"],["MUHAMMAD HANAPI","Hanapi","Putra"],["NABIL AUFA SATRIAJI","Nabil","Putra"],["NABILA RAHMANDA","Bila/Bilbil","Putri"],["NABILLA AZZAHRA","Abil","Putri"],["NIA RAHMADANI","Anya Cantik","Putri"],["NUR HAFIZAH HANIF","Hanif (Hamik/Mik)","Putri"],["NURASSYIFA ARRIZQI","Syifa","Putri"],["PUTRI NUR ADELIA","Putri","Putri"],["RAMADHANI AGUSTINA","Hani","Putri"],["REZA OKTA ARIANA","Eja","Putri"],["RIFATUL AKBAR","Abay","Putra"],["RIZQI TAUFIQURAHMAN","Topek/Iki","Putra"],["TIARA SAFITRI","Tiara","Putri"],["ULFA AULIA","Lia","Putri"],["USMA LUNA","Luna","Putri"],["WITA","Thaa","Putri"],["ZAHWA SASABILA","Zahwa","Putri"],["ICA","Ica","Putri"]
];
let aktif="all";const grid=document.getElementById("grid"),q=document.getElementById("search"),empty=document.getElementById("empty");
function render(){let key=q.value.toLowerCase().trim();let data=siswa.map((s,i)=>({s,i})).filter(x=>(aktif==="all"||x.s[2]===aktif)&&(x.s[0].toLowerCase().includes(key)||x.s[1].toLowerCase().includes(key)));grid.innerHTML=data.map(({s,i})=>`<a class="member" href="profil.html?id=${i+1}"><div class="avatar">${s[2]==="Putra"?"👦":"👧"}</div><div class="info"><b>${s[0]}</b><small>${s[1]} • ${s[2]}</small></div><div class="arrow">›</div></a>`).join("");empty.style.display=data.length?"none":"block"}q.addEventListener("input",render);document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");aktif=b.dataset.f;render()});render();
</script>
</body>
</html>
